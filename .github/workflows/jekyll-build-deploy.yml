name: Build and deploy Jekyll site

# Runs when the Jekyll source branch is updated, then publishes the built
# site to the `master` branch (which GitHub Pages serves).
on:
  push:
    branches: [ jekyll ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Install Pygments (pygments highlighter)
        run: sudo apt-get update && sudo apt-get install -y python3-pygments

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Deploy to master
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: master
          publish_dir: ./_site
          cname: tkr.fyi
          enable_jekyll: false
